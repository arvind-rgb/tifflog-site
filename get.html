<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Get Tiff Log</title>
  <meta name="description" content="Tiff Log, free on iPhone and Android. A private app for the little fights with your people." />
  <meta property="og:title" content="Tiff Log: from ugh to us" />
  <meta property="og:description" content="A private app for the little fights with your partner, mom, the roomie, the bruh. Free on iPhone and Android." />
  <meta property="og:url" content="https://tifflog.ai/get" />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="https://tifflog.ai/media/og.jpg" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="theme-color" content="#f4ede1" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="site.css" />
  <script>
    // One link for every post: phones go straight to their store, laptops see both + a QR.
    // ?src=linkedin (etc.) is passed to Google Play as the install referrer so we can see which post worked.
    (function () {
      var q = new URLSearchParams(location.search);
      var src = (q.get('src') || 'direct').replace(/[^a-z0-9_-]/gi, '').slice(0, 30);
      var ua = navigator.userAgent || '';
      var ios = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
      var android = /Android/.test(ua);
      var to = q.get('to') || (ios ? 'ios' : android ? 'android' : '');
      var APPLE = 'https://apps.apple.com/app/id6820374810';
      var PLAY = 'https://play.google.com/store/apps/details?id=ai.tifflog.app&referrer=' + encodeURIComponent('utm_source=' + src + '&utm_medium=get');
      window.TIFF_LINKS = { apple: APPLE, play: PLAY };
      if (to === 'ios') location.replace(APPLE);
      else if (to === 'android') location.replace(PLAY);
    })();
  </script>
</head>
<body>
  <main class="wrap">
    <section class="hero">
      <h1 class="display">Tiff Log</h1>
      <span class="sticker">from ugh → us</span>
      <p class="lede">Free on iPhone and Android. No ads. 💌</p>
      <div class="cta">
        <div class="stores">
          <a class="btn" id="apple" href="https://apps.apple.com/app/id6820374810">APP STORE</a>
          <a class="btn secondary" id="play" href="https://play.google.com/store/apps/details?id=ai.tifflog.app">GOOGLE PLAY</a>
        </div>
        <div class="qr-desk">
          <img src="media/get-qr.svg" width="140" height="140" alt="QR code that opens Tiff Log in your phone's app store" />
          <p class="mono small soft">on a laptop? scan with your phone</p>
        </div>
        <a class="mono small soft" href="/">what is tiff log?</a>
      </div>
    </section>
  </main>
  <script>
    if (window.TIFF_LINKS) {
      document.getElementById('apple').href = window.TIFF_LINKS.apple;
      document.getElementById('play').href = window.TIFF_LINKS.play;
    }
  </script>
</body>
</html>
